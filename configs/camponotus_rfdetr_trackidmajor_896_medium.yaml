# RF-DETR **Medium** — Camponotus track_id–majority (full CVAT bundle) @896.
# Effective batch = batch_size * grad_accum_steps = 2 * 8 = 16 (matches Small 4×4).
# If VRAM allows, try batch_size: 4 and grad_accum_steps: 4.

dataset_dir: datasets/camponotus_rfdetr_coco_trackidmajor
output_dir: experiments/rfdetr/camponotus_rfdetr_trackidmajor_896_medium
model_class: RFDETRMedium
resume_checkpoint: null

epochs: 60
batch_size: 2
grad_accum_steps: 8
lr: 1.0e-4
seed: 42
resolution: 896
early_stopping: true
early_stopping_patience: 12
tensorboard: false
device: cuda:0
